[package]
name = "noactually-app"
description = "No, Actually... desktop app: tray quick glance and full scorecard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lib]
name = "noactually_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
engine.workspace = true
sources.workspace = true
store.workspace = true
# The report-card helper commands (`hook`, `digest`) run from this executable (see main.rs).
cli = { path = "../../crates/cli", package = "noactually-cli" }
serde.workspace = true
# Used by the code `tauri::generate_context!` expands to.
serde_json.workspace = true
chrono.workspace = true
# The home folder, for the Codex files report cards add.
dirs.workspace = true
log.workspace = true
tauri.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-positioner.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-log.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-updater.workspace = true
notify.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# Asks D-Bus whether the desktop shows tray icons (already in the tree through Tauri).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
