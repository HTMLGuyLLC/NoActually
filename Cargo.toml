[workspace]
resolver = "2"
members = ["crates/engine", "crates/sources", "crates/store", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/HTMLGuyLLC/NoActually"

[workspace.dependencies]
engine = { path = "crates/engine" }
sources = { path = "crates/sources" }
store = { path = "crates/store" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
anyhow = "1"
tempfile = "3"
dirs = "6"
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
