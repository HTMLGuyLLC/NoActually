[package]
name = "noactually-cli"
description = "Command-line scorecard. Same engine and store as the desktop app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

# The commands live in a library so the desktop app can run the report-card helper commands
# (`digest`, `hook`) from its own executable.
[lib]
name = "cli"

[[bin]]
name = "noactually"
path = "src/main.rs"

[dependencies]
engine.workspace = true
sources.workspace = true
store.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
memchr.workspace = true

[dev-dependencies]
sources = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
