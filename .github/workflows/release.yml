name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Least privilege: nothing is writable until the job that publishes asks for it.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ matrix.name }}
    # Manual runs are only allowed on main (to test the pipeline); real releases come from tags.
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    permissions:
      contents: write
    # macOS builds only run here when signing secrets are set. Without them, the signed and
    # notarized DMG comes from scripts/release-macos.sh on a maintainer's Mac, and CI never
    # uploads an unsigned macOS build beside it.
    env:
      SIGN_MAC: ${{ secrets.APPLE_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            mac: true
          - name: Windows
            platform: windows-latest
            args: ''
            rust_targets: ''
            mac: false
          - name: Linux
            platform: ubuntu-22.04
            args: ''
            rust_targets: ''
            mac: false
    steps:
      - name: Skip unsigned macOS
        if: matrix.mac && env.SIGN_MAC != 'true'
        run: echo "No Apple signing secrets; the macOS DMG is built and notarized locally."

      - uses: actions/checkout@v7
        if: ${{ !matrix.mac || env.SIGN_MAC == 'true' }}

      # tauri-action names the release after the app version; a different tag would silently
      # publish a second, mismatched release. The Cargo workspace version is the source of truth.
      - name: Tag matches app version
        if: ${{ github.ref_type == 'tag' && (!matrix.mac || env.SIGN_MAC == 'true') }}
        shell: bash
        run: |
          v=$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version *=/{gsub(/[" ]/,"",$0); sub(/^version=/,"",$0); print; exit}' Cargo.toml)
          [ -n "$v" ] || { echo "Couldn't read the Cargo workspace version"; exit 1; }
          [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "Tag ${GITHUB_REF_NAME} doesn't match app version v$v"; exit 1; }

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.mac || env.SIGN_MAC == 'true' }}
        with:
          targets: ${{ matrix.rust_targets }}

      # Release builds read the cache but never write it, so a cache can't be poisoned into a signed build.
      - uses: Swatinem/rust-cache@v2
        if: ${{ !matrix.mac || env.SIGN_MAC == 'true' }}
        with:
          save-if: false

      - uses: pnpm/action-setup@v6
        if: ${{ !matrix.mac || env.SIGN_MAC == 'true' }}

      - uses: actions/setup-node@v7
        if: ${{ !matrix.mac || env.SIGN_MAC == 'true' }}
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend deps
        if: ${{ !matrix.mac || env.SIGN_MAC == 'true' }}
        run: pnpm --dir app install --frozen-lockfile

      # Pinned by commit: this step runs with a write token and the signing secrets.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        if: ${{ !matrix.mac || env.SIGN_MAC == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Signs the updater files and latest.json entries (see CONTRIBUTING.md, "Releasing").
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: 'No, Actually... v__VERSION__'
          releaseBody: 'See the [changelog](https://github.com/HTMLGuyLLC/NoActually/blob/main/CHANGELOG.md).'
          releaseDraft: true
          # latest.json for in-app updates. scripts/finish-release.sh points it at the renamed files
          # and adds the Mac entries.
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          # The signatures are inside latest.json; the .sig files would only clutter the release page.
          uploadUpdaterSignatures: false
          prerelease: false
          args: ${{ matrix.args }}
