version: 2
# Grouped so routine bumps arrive as one PR per ecosystem instead of a dozen.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(rust)"
    labels: [dependencies, rust]
    # Groups match in the order listed, so `tauri` claims its crates before `rust-minor`.
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
      rust-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(app)"
    labels: [dependencies, javascript]
    # Groups match in the order listed, so `tauri` claims @tauri-apps/* before `app-minor`.
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      app-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels: [dependencies, github_actions]
    groups:
      actions:
        patterns: ["*"]
