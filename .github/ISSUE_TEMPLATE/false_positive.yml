name: Wrong correction (false positive or miss)
description: A message was counted as a correction when it should not be, or missed when it should count.
labels: [rules]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste private content.** Redact names, emails, URLs, keys, file paths and anything else personal.
        Keep only the words that matter, like "no, that's not right" and "you're right, my mistake".
  - type: dropdown
    id: direction
    attributes:
      label: What went wrong
      options:
        - Counted as a correction, but should not be
        - Not counted, but should be
        - Wrong category
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Redacted example
      description: Your message, with the AI reply before and after it if relevant.
      placeholder: |
        AI: ...
        You: ...
        AI: ...
    validations:
      required: true
  - type: dropdown
    id: expected
    attributes:
      label: Category you expected
      description: The names the app shows under "What you correct".
      options:
        - Made it up
        - Ignored instructions
        - Misread you
        - Missed something
        - Still broken
        - Flat-out wrong
        - None (not a correction)
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: AI tool
      placeholder: Claude Code, Codex, ChatGPT export...
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule id (optional)
      description: Only if the app shows one for this message. Leave it empty if you can't find it.
  - type: input
    id: version
    attributes:
      label: App version
  - type: checkboxes
    id: redacted
    attributes:
      label: Privacy
      options:
        - label: I removed all private content from this report.
          required: true
