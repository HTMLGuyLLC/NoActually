name: Bug report
description: Something is broken or behaves wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste private chat content. Redact anything personal.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS version
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact private content first.
