# cargo-deny: `cargo deny check` (CI runs it on every push).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
# Fail on any vulnerability or unsound crate; unmaintained crates only in our direct dependencies.
unmaintained = "workspace"
yanked = "deny"
ignore = [
  # glib 0.18's VariantStrIter is unsound. Tauri pins gtk-rs 0.18 on Linux, so it can't be
  # upgraded until Tauri moves; nothing here uses VariantStrIter. Drop this once glib >= 0.20.
  { id = "RUSTSEC-2024-0429", reason = "glib 0.18 is pinned by Tauri's GTK stack; VariantStrIter is unused" },
]

[licenses]
# Permissive licenses only. Everything here is compatible with shipping an MIT app.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Tauri's tree pulls a few crates in two versions (windows-sys, bitflags, …); worth seeing, not
# worth blocking on.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
